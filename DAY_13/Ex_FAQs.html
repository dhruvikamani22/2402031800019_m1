<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Example</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .faq {
            margin: 10px 0;
        }

        .question {
            background: #f0f0f0;
            padding: 10px;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        .answer {
            display: none;
            padding: 10px;
            border: 1px solid #ccc;
            border-top: none;
        }

        .btn {
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="faq">
        <div class="question">
            <button class="btn">+</button>
            What is jQuery?
        </div>
        <div class="answer">
            jQuery is a JavaScript library used to simplify DOM manipulation and event handling.
        </div>
    </div>

    <div class="faq">
        <div class="question">
            <button class="btn">+</button>
            What is HTML?
        </div>
        <div class="answer">
            HTML stands for HyperText Markup Language and is used to create web pages.
        </div>
    </div>

    <div class="faq">
        <div class="question">
            <button class="btn">+</button>
            What is CSS?
        </div>
        <div class="answer">
            CSS is used to style and design HTML elements.
        </div>
    </div>

    <script>
        $(".btn").click(function() {

            $(this)
                .closest(".faq")
                .find(".answer")
                .slideToggle();

            if ($(this).text() == "+") {
                $(this).text("-");
            } else {
                $(this).text("+");
            }
        });
    </script>

</body>
</html>
